name: molvest-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-molvest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-molvest123}
      POSTGRES_DB: ${POSTGRES_DB:-molvestdb}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - molvest-dev

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    healthcheck:
      # The Qdrant image intentionally has no curl/wget; verify its HTTP port
      # with bash's built-in /dev/tcp instead.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - molvest-dev

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - molvest-dev

  backend:
    init: true
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-molvest}:${POSTGRES_PASSWORD:-molvest123}@postgres:5432/${POSTGRES_DB:-molvestdb}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_CA_BUNDLE_FILE: /etc/ssl/certs/ca-certificates.crt
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RAG_CACHE_TTL_SECONDS: ${RAG_CACHE_TTL_SECONDS:-900}
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-2}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-2}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-/opt/models/bge-m3}
      DOCLING_ARTIFACTS_PATH: ${DOCLING_ARTIFACTS_PATH:-/opt/models/docling}
      KB_INDEX_CONCURRENCY: ${KB_INDEX_CONCURRENCY:-1}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-15}
      DIALOG_IDLE_TIMEOUT_HOURS: ${DIALOG_IDLE_TIMEOUT_HOURS:-24}
      DIALOG_IDLE_SCAN_SECONDS: ${DIALOG_IDLE_SCAN_SECONDS:-300}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/var/storage}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-molvest}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      STORAGE_OPERATION_TIMEOUT_SECONDS: ${STORAGE_OPERATION_TIMEOUT_SECONDS:-60}
      S3_CONNECT_TIMEOUT_SECONDS: ${S3_CONNECT_TIMEOUT_SECONDS:-10}
      S3_READ_TIMEOUT_SECONDS: ${S3_READ_TIMEOUT_SECONDS:-60}
      GIGACHAT_TIMEOUT_SECONDS: ${GIGACHAT_TIMEOUT_SECONDS:-120}
      AI_TURN_RECOVERY_SCAN_SECONDS: ${AI_TURN_RECOVERY_SCAN_SECONDS:-15}
      UPLOAD_MAX_CONCURRENCY: ${UPLOAD_MAX_CONCURRENCY:-2}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - backend_dev_storage:/app/var/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - molvest-dev

  frontend:
    init: true
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - molvest-dev

volumes:
  postgres_dev_data:
  qdrant_dev_data:
  backend_dev_storage:

networks:
  molvest-dev:
    driver: bridge

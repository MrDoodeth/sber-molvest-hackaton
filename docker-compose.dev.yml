name: molvest-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-molvest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-molvest}
      POSTGRES_DB: ${POSTGRES_DB:-molvest}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - molvest-dev

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    healthcheck:
      # The Qdrant image intentionally has no curl/wget; verify its HTTP port
      # with bash's built-in /dev/tcp instead.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - molvest-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-molvest}:${POSTGRES_PASSWORD:-molvest}@postgres:5432/${POSTGRES_DB:-molvest}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_CA_BUNDLE_FILE: /etc/ssl/certs/ca-certificates.crt
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-in-production}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
      AUTH_COOKIE_SECURE: "false"
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_MODEL_PATH: /opt/models/bge-m3
      DOCLING_ARTIFACTS_PATH: /opt/models/docling
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-15}
      DIALOG_IDLE_TIMEOUT_HOURS: ${DIALOG_IDLE_TIMEOUT_HOURS:-24}
      DIALOG_IDLE_SCAN_SECONDS: ${DIALOG_IDLE_SCAN_SECONDS:-300}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /app/var/storage
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-molvest}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - backend_dev_storage:/app/var/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - molvest-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - molvest-dev

volumes:
  postgres_dev_data:
  qdrant_dev_data:
  backend_dev_storage:

networks:
  molvest-dev:
    driver: bridge
